<div class="cart-buy">
    <h1>{{ cartitemscount }} Items Selected</h1>
    <button class="buy" (click)="cartbuy()">
      Proceed to Buy ({{ cartitemscount }} Items) - INR {{ carttotalamount }}
    </button>
  </div>
  
  <p class="select-all">
    <input type="checkbox" class="allselect" [(ngModel)]="selectAllChecked" (change)="selectallchanged()"> 
    <label>Select all items</label>
  </p>
  
  <div *ngFor="let product of productimg">
    <div class="cart-container">
      <div class="product">
        <input type="checkbox" class="check" [(ngModel)]="product.isselected" (change)="productcheckchanged()">
        <img [src]="product.productimg" alt="Product Image">
      </div>
      
      <div class="desc">
        <h2>{{ product.productname }}</h2>
        <p class="sub-text">Stardust Black, 6GB RAM, 128GB Storage | 90Hz Display | 50MP AI Triple Camera</p>
        <p class="info">400+ bought this month</p>
        <h3 class="price">RS. {{ product.count * product.price }}</h3>
        <h4 class="stock">✔ In stock</h4>
  
        <div class="actions">
          <button class="buy-btn" (click)="buy(product)">Buy Now</button>
          <button class="delete-btn" (click)="removeFromCart(product)">Delete</button>
          <button class="more-btn">See More Like This</button>
        </div>
  
        <h3 class="quantity">
          Quantity 
          <span class="qty-btn" (click)="quantitycount(product, 'decrease')">➖</span> 
          | {{ product.count }} | 
          <span class="qty-btn" (click)="quantitycount(product, 'increase')">➕</span>
        </h3>
      </div>
    </div>
    <hr>
  </div>
